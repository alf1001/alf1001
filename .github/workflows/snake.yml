name: Generate Snake

on:
  schedule:
    # Menjadwalkan untuk dijalankan setiap 6 jam
    - cron: "0 */6 * * *"

  # Menjalankan secara manual dari tab Actions
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository agar bisa bekerja dengan file-file di repo
      - uses: actions/checkout@v2

      # Menggunakan Platane untuk menghasilkan snake GIF dan SVG
      - uses: Platane/snk@master
        id: snake-gif
        with:
          github_user_name: alf1001
          gif_out_path: dist/github-contribution-grid-snake.gif
          svg_out_path: dist/github-contribution-grid-snake.svg

      # Menampilkan status Git untuk debugging
      - run: git status

      # Commit perubahan di branch output
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Generate contribution snake"
        continue-on-error: true  # Jangan error jika tidak ada perubahan

      # Push ke branch `output`
      - name: Push changes to output branch
        uses: ad-m/github-push-action@v0.6.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: output  # Push ke branch output, bukan main
          force: true

      # Men-deploy hasilnya ke GitHub Pages atau ke direktori lain jika diperlukan
      - name: Deploy to GitHub Pages
        uses: crazy-max/ghaction-github-pages@v2.1.3
        with:
          target_branch: output  # Menggunakan branch output untuk deploy
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
